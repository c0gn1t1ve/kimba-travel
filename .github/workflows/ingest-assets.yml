name: ingest-assets
on:
  push:
    paths:
      - .github/workflows/ingest-assets.yml
      - .github/asset-urls.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and verify assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, pathlib, urllib.request
          manifest = json.loads(pathlib.Path('.github/asset-urls.json').read_text())
          for path, meta in manifest.items():
              pathlib.Path(path).parent.mkdir(parents=True, exist_ok=True)
              print('fetch', path)
              urllib.request.urlretrieve(meta['url'], path)
              sha = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if sha != meta['sha']:
                  raise SystemExit(f'SHA mismatch {path}: {sha} != {meta["sha"]}')
              print('ok', path, sha)
          PY
      - name: Commit assets and remove ingest files
        run: |
          set -euo pipefail
          git config user.name "c0gn1t1ve"
          git config user.email "37445150+c0gn1t1ve@users.noreply.github.com"
          rm -f .github/workflows/ingest-assets.yml .github/asset-urls.json
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git status
          git commit -m "Add package-lock.json and public/images JPEG assets"
          git push origin HEAD:main
